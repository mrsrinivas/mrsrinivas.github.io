<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#06060f"/>
      <stop offset="55%" stop-color="#0f0e23"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="55%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>

    <linearGradient id="cool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#475569" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.92"/>
    </linearGradient>

    <filter id="warmGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g opacity="0.55" fill="#fff">
    <circle cx="120" cy="80" r="1.2"/>
    <circle cx="320" cy="140" r="1.0"/>
    <circle cx="1320" cy="120" r="1.4"/>
    <circle cx="1480" cy="280" r="1.6"/>
    <circle cx="1280" cy="600" r="1.0"/>
    <circle cx="80" cy="660" r="1.0"/>
    <circle cx="1100" cy="60" r="0.8"/>
    <circle cx="60" cy="430" r="1.1"/>
  </g>

  <text x="120" y="100" fill="#a78bfa" font-size="22" font-weight="600" letter-spacing="6">
    AI · ARCHITECTURE
  </text>

  <!-- ===================================================== -->
  <!-- THE RENTED LAYER — three commoditised pieces           -->
  <!-- ===================================================== -->
  <g transform="translate(220, 160)">
    <!-- soft cluster halo -->
    <ellipse cx="580" cy="60" rx="600" ry="55" fill="#cbd5e1" opacity="0.05" filter="url(#softGlow)"/>

    <!-- Header label above the cluster -->
    <text x="580" y="-10" text-anchor="middle" fill="#94a3b8" font-size="18" font-style="italic" letter-spacing="3" opacity="0.85">
      RENTED · COMMODITISING · INTERCHANGEABLE
    </text>

    <!-- Chip 1: Foundation Model -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="360" height="90" rx="45" ry="45"
            fill="url(#cool)" stroke="#94a3b8" stroke-width="1.2" opacity="0.88"/>
      <g fill="#94a3b8" opacity="0.55">
        <rect x="-8" y="32" width="12" height="5" rx="2"/>
        <rect x="-8" y="50" width="12" height="5" rx="2"/>
        <rect x="-8" y="68" width="12" height="5" rx="2"/>
        <rect x="356" y="32" width="12" height="5" rx="2"/>
        <rect x="356" y="50" width="12" height="5" rx="2"/>
        <rect x="356" y="68" width="12" height="5" rx="2"/>
      </g>
      <text x="180" y="42" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">
        🤖 Foundation Model
      </text>
      <text x="180" y="68" text-anchor="middle" fill="#94a3b8" font-size="13" font-style="italic">
        anthropic · openai · gemini · meta
      </text>
    </g>

    <!-- Chip 2: Vector DB -->
    <g transform="translate(390, 20)">
      <rect x="0" y="0" width="360" height="90" rx="45" ry="45"
            fill="url(#cool)" stroke="#94a3b8" stroke-width="1.2" opacity="0.78"/>
      <g fill="#94a3b8" opacity="0.5">
        <rect x="-8" y="32" width="12" height="5" rx="2"/>
        <rect x="-8" y="50" width="12" height="5" rx="2"/>
        <rect x="-8" y="68" width="12" height="5" rx="2"/>
        <rect x="356" y="32" width="12" height="5" rx="2"/>
        <rect x="356" y="50" width="12" height="5" rx="2"/>
        <rect x="356" y="68" width="12" height="5" rx="2"/>
      </g>
      <text x="180" y="42" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">
        🔍 Vector DB
      </text>
      <text x="180" y="68" text-anchor="middle" fill="#94a3b8" font-size="13" font-style="italic">
        pinecone · weaviate · qdrant · pgvector
      </text>
    </g>

    <!-- Chip 3: Agent Framework + Routing -->
    <g transform="translate(780, 20)">
      <rect x="0" y="0" width="380" height="90" rx="45" ry="45"
            fill="url(#cool)" stroke="#94a3b8" stroke-width="1.2" opacity="0.72"/>
      <g fill="#94a3b8" opacity="0.5">
        <rect x="-8" y="32" width="12" height="5" rx="2"/>
        <rect x="-8" y="50" width="12" height="5" rx="2"/>
        <rect x="-8" y="68" width="12" height="5" rx="2"/>
        <rect x="376" y="32" width="12" height="5" rx="2"/>
        <rect x="376" y="50" width="12" height="5" rx="2"/>
        <rect x="376" y="68" width="12" height="5" rx="2"/>
      </g>
      <text x="190" y="42" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">
        🧰 Framework + Routing
      </text>
      <text x="190" y="68" text-anchor="middle" fill="#94a3b8" font-size="13" font-style="italic">
        agent SDKs · model routers · evals
      </text>
    </g>
  </g>

  <!-- ===================================================== -->
  <!-- CONTEXT ENGINEERING — runtime discipline (the bridge)  -->
  <!-- ===================================================== -->
  <g transform="translate(0, 340)">
    <rect x="220" y="0" width="1160" height="62" rx="31" ry="31"
          fill="url(#violet)" opacity="0.95"/>
    <rect x="220" y="0" width="1160" height="3" fill="#ede9fe" opacity="0.7"/>

    <text x="800" y="32" text-anchor="middle" fill="#ede9fe" font-size="24" font-weight="700">
      Context Engineering
    </text>
    <text x="800" y="54" text-anchor="middle" fill="#ddd6fe" font-size="15" font-style="italic" opacity="0.92">
      runtime discipline · scope · relevance · freshness · budget
    </text>

    <!-- arrows down into substrate -->
    <g stroke="#c4b5fd" stroke-width="2" fill="none" opacity="0.7">
      <line x1="450" y1="62" x2="450" y2="92"/>
      <polygon points="445,88 455,88 450,98" fill="#c4b5fd"/>
      <line x1="800" y1="62" x2="800" y2="92"/>
      <polygon points="795,88 805,88 800,98" fill="#c4b5fd"/>
      <line x1="1150" y1="62" x2="1150" y2="92"/>
      <polygon points="1145,88 1155,88 1150,98" fill="#c4b5fd"/>
    </g>

    <!-- arrow up to rented cluster -->
    <g stroke="#c4b5fd" stroke-width="2" fill="none" opacity="0.7">
      <line x1="800" y1="0" x2="800" y2="-50"/>
      <polygon points="795,-46 805,-46 800,-56" fill="#c4b5fd"/>
    </g>
  </g>

  <!-- ===================================================== -->
  <!-- THE THREE-LAYER SUBSTRATE                             -->
  <!-- ===================================================== -->
  <g transform="translate(280, 460)" filter="url(#warmGlow)">

    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="1040" height="92" rx="10" ry="10" fill="url(#amber)" opacity="0.96"/>
      <rect x="0" y="0" width="1040" height="4" fill="#fed7aa" opacity="0.7"/>
      <text x="40" y="40" fill="#3b1106" font-size="28" font-weight="700">Semantic Layer</text>
      <text x="40" y="70" fill="#7c2d12" font-size="16" font-style="italic" opacity="0.9">
        business terms → typed queries · one definition per term, owned and versioned
      </text>
    </g>

    <g transform="translate(0, 108)">
      <rect x="0" y="0" width="1040" height="92" rx="10" ry="10" fill="url(#amber)" opacity="0.9"/>
      <rect x="0" y="0" width="1040" height="4" fill="#fed7aa" opacity="0.7"/>
      <text x="40" y="40" fill="#3b1106" font-size="28" font-weight="700">Knowledge Graph</text>
      <text x="40" y="70" fill="#7c2d12" font-size="16" font-style="italic" opacity="0.9">
        typed edges · provenance per relationship · validity windows
      </text>
    </g>

    <g transform="translate(0, 216)">
      <rect x="0" y="0" width="1040" height="92" rx="10" ry="10" fill="url(#amber)" opacity="0.84"/>
      <rect x="0" y="0" width="1040" height="4" fill="#fed7aa" opacity="0.7"/>
      <text x="40" y="40" fill="#3b1106" font-size="28" font-weight="700">Metadata <tspan font-size="18" font-weight="500" font-style="italic" opacity="0.8">(+ quality signals)</tspan></text>
      <text x="40" y="70" fill="#7c2d12" font-size="16" font-style="italic" opacity="0.9">
        ownership · taxonomy · policy · lineage · freshness · completeness
      </text>
    </g>

  </g>

  <!-- "Your moat" marker -->
  <g transform="translate(1340, 612)">
    <line x1="0" y1="-130" x2="0" y2="130" stroke="#fb923c" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="-130" x2="-12" y2="-120" stroke="#fb923c" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="-130" x2="12" y2="-120" stroke="#fb923c" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="130" x2="-12" y2="120" stroke="#fb923c" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="130" x2="12" y2="120" stroke="#fb923c" stroke-width="2" opacity="0.6"/>
    <g transform="translate(20, 0)">
      <text x="0" y="-10" fill="#fed7aa" font-size="22" font-weight="700">YOUR</text>
      <text x="0" y="22" fill="#fed7aa" font-size="22" font-weight="700">MOAT</text>
    </g>
  </g>

  <ellipse cx="800" cy="800" rx="540" ry="12" fill="#000" opacity="0.5" filter="url(#softGlow)"/>

  <text x="800" y="855" text-anchor="middle" fill="#cbd5e1" font-size="20" font-style="italic" opacity="0.88">
    Three layers you own · One discipline that wires them to the rented bits above
  </text>

</svg>
